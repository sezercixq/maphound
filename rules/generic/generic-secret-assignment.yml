id: generic-secret-assignment
name: "Hard-coded secret"
description: "High-entropy string assigned to a secret-looking name (apiKey, clientSecret, password, token...)."
severity: medium
confidence: medium
generic: true
keywords: ["apikey", "api_key", "api-key", "secret", "token", "password", "passwd", "private_key"]
regex: '(?:api[_-]?key|api[_-]?secret|client[_-]?secret|secret[_-]?key|access[_-]?token|auth[_-]?token|private[_-]?key|password|passwd|secret)[''"`]?\s{0,4}[:=]{1,2}>?\s{0,4}[''"`]([A-Za-z0-9_\-+/=.!@#$%^&*]{16,128})[''"`]'
flags: i
secretGroup: 1
entropy: 3.8
references:
  - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
tests:
  positive:
    - 'const config = { clientSecret: "5dA2fMhpHdGK7s8n{{}}Ocgc0AOuxAgE7SD1" };'
    - 'apiKey="{{}}Xr8IQXmD8uwabbftPiyl8qlToDeH4XMBAIhgBBaN"'
  negative:
    - 'password{{}}: "your_password_here_please"'
    - 'apiKey{{}}: "aaaaaaaaaaaaaaaaaaaaaaaa"'
    - 'token{{}}: "${process.env.TOKEN}"'
    - 'secret{{}}: "abc"'
    - 'apiKey{{}}: "DUclUa905WtavLu1Si9QpCE1kkXvCJgr3fy75tU8" // maphound-ignore'
