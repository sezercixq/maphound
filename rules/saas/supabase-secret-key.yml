id: supabase-secret-key
name: "Supabase secret API key"
description: "New-format Supabase secret key with elevated privileges."
severity: critical
confidence: high
keywords: ["sb_secret_"]
regex: "(?<![A-Za-z0-9_-])(sb_secret_[A-Za-z0-9_-]{30,64})(?![A-Za-z0-9_-])"
secretGroup: 1
entropy: 3.5
references:
  - https://supabase.com/docs/guides/api/api-keys
tests:
  positive:
    - '"sb_secret_{{}}v5BMzvOV9VxAHx39ZG057x0ale1djqU10X37ndVb"'
  negative:
    - "sb_publishable_abcdefghijklmnopqrstuvwxyz0123"
    - "sb_secret_{{}}xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
