id: slack-webhook-url
name: "Slack incoming webhook"
description: "Anyone with the URL can post into the Slack channel."
severity: high
confidence: high
keywords: ["hooks.slack.com/"]
regex: '(https://hooks\.slack\.com/(?:services/T[A-Z0-9]{6,12}/B[A-Z0-9]{6,12}/[A-Za-z0-9]{20,32}|workflows/T[A-Z0-9]{6,12}/A[A-Z0-9]{6,12}/[0-9]{12,20}/[A-Za-z0-9]{20,32}|triggers/T[A-Z0-9]{6,12}/[0-9]{8,20}/[A-Za-z0-9]{20,32}))(?![A-Za-z0-9])'
secretGroup: 1
entropy: 3.0
references:
  - https://api.slack.com/messaging/webhooks
tests:
  positive:
    - 'fetch("https://hooks.slack.com/services/TZA67WWG6/BZ392QFHVBV/{{}}0C4icMDBpwNMhmuVzu7BVfIw")'
  negative:
    - "https://hooks.slack.com/{{}}services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"
