    - 'new OpenAI({ apiKey: "sk-proj-{{}}xtVE4csx9WPhYkCF2SmqRv905nBtynD8x6TMsKEwOvlGxYZbgj2uIXMg4TeE8VHIpvY5mDIGfiVz_mja1-fZ0nGsXAfsRnYclC1g8NGc5Akr1JPKNsXxqPRzOjQZ0OF-8UuOyw2hnIg-YqmKTCR57UjjN130" })'
    - '"sk-iMWIBcW8EUXH0sI9QIWLT3Blbk{{}}FJiiudv9cYvdZzLCnlfaDt"'
