regex: "(?<![A-Za-z0-9_-])(sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{40,250}|sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20})(?![A-Za-z0-9_-])"
secretGroup: 1
entropy: 3.5
references:
  - https://platform.openai.com/docs/api-reference/authentication
