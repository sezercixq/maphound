id: stripe-test-secret-key
name: "Stripe test secret key"
description: "Stripe test-mode secret key. Cannot move money, but exposes test data and suggests weak key handling."
severity: low
confidence: high
keywords: ["sk_test_", "rk_test_"]
regex: "(?<![A-Za-z0-9_])((?:sk|rk)_test_[0-9a-zA-Z]{24,247})(?![0-9a-zA-Z])"
secretGroup: 1
entropy: 3.5
references:
  - https://docs.stripe.com/keys
tests:
  positive:
    - '"sk_test_{{}}fMHLvDfTigwt7syLUuzQKhpk"'
  negative:
    - "sk_test_{{}}xxxxxxxxxxxxxxxxxxxxxxxx"
