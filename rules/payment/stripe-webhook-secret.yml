id: stripe-webhook-secret
name: "Stripe webhook signing secret"
description: "Lets an attacker forge Stripe webhook events that the backend will trust."
severity: high
confidence: high
keywords: ["whsec_"]
regex: "(?<![A-Za-z0-9_])(whsec_[A-Za-z0-9+/]{32,64})(?![A-Za-z0-9+/])"
secretGroup: 1
entropy: 3.5
references:
  - https://docs.stripe.com/webhooks#verify-events
tests:
  positive:
    - 'STRIPE_WEBHOOK_SECRET="whsec_{{}}DbzNb6OZZ6E3fbFgfxlYQKdLM6Upssf7"'
  negative:
    - "whsec_{{}}xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
