id: stripe-live-secret-key
name: "Stripe live secret key"
description: "Stripe live secret or restricted key: can create charges, refunds and read customer data."
severity: critical
confidence: high
keywords: ["sk_live_", "rk_live_"]
regex: "(?<![A-Za-z0-9_])((?:sk|rk)_live_[0-9a-zA-Z]{24,247})(?![0-9a-zA-Z])"
secretGroup: 1
entropy: 3.5
references:
  - https://docs.stripe.com/keys
tests:
  positive:
    - 'const stripe = Stripe("sk_live_{{}}bx2dgWG4PHCbmvSTZ4HBxkgZRDTc8uI3CqiiKUwSA6HKwUMztUL3hiUYKV4HkWycYu9BVsGxJFrUGrTfVMI5RwX2SnuLSCJsbJ7");'
    - "rk_live_{{}}BBEzgDGDDdBnuG9Gjr8sNwno"
  negative:
    - "sk_live_{{}}xxxxxxxxxxxxxxxxxxxxxxxx"
    - "sk_live_{{}}YOUR_KEY_HERE_1234567890"
    - "pk_live_{{}}jHojXnCLOaMJAFuLRP5FdaHa"
