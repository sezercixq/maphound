id: gcp-service-account-key
name: "Google service account key file"
description: "Service account JSON key (private_key_id). The private key in the same file grants the account's IAM roles."
severity: critical
confidence: high
keywords: ["private_key_id"]
regex: '"private_key_id"\s{0,4}:\s{0,4}"([a-f0-9]{40})"'
secretGroup: 1
entropy: 3.0
references:
  - https://cloud.google.com/iam/docs/keys-create-delete
tests:
  positive:
    - '{"type":"service_account","project_id":"demo","private_key_id":"feba18beb8daac6a2780{{}}5dada8dc3ad79c8a4a7c"}'
  negative:
    - '"private_key_id{{}}": "0000000000000000000000000000000000000000"'
    - '"private_key_id{{}}": "abc"'
