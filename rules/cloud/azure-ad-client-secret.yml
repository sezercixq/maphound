id: azure-ad-client-secret
name: "Microsoft Entra ID client secret"
description: "Client secret of an Entra ID (Azure AD) app registration."
severity: high
confidence: medium
keywords: ["q~"]
regex: '(?<![A-Za-z0-9_~.-])([A-Za-z0-9_~.-]{3}\dQ~[A-Za-z0-9_~.-]{31,34})(?![A-Za-z0-9_~.-])'
secretGroup: 1
entropy: 3.5
references:
  - https://learn.microsoft.com/entra/identity-platform/howto-create-service-principal-portal
tests:
  positive:
    - 'clientSecret: "UZB8Q~{{}}daR8LDhXmWAR5RFH34Mh9HgLUPq1q~jvoT"'
  negative:
    - 'clientSecret: "abc8Q~{{}}short"'
