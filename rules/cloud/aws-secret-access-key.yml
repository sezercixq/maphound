id: aws-secret-access-key
name: "AWS secret access key"
description: "Secret half of an AWS IAM key pair: full API access with the key's permissions."
severity: critical
confidence: high
keywords: ["aws"]
regex: 'aws[\w.-]{0,32}?(?:secret|sk)[\w.-]{0,24}?[''"`]?\s{0,4}[:=]{1,2}>?\s{0,4}[''"`]([A-Za-z0-9/+]{40})(?![A-Za-z0-9/+=])'
flags: i
secretGroup: 1
entropy: 4.0
references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/security-creds.html
tests:
  positive:
    - 'const AWS_SECRET_ACCESS_KEY = "{{}}eNnAvitQKR2qdf+HcJjwbkhJWENgTgrpeUbBvb9X";'
    - '{"awsSecretAccessKey": "M0PP7enmiVY5FQuhQ+1K{{}}SJ7g33M0wENeSvcf2BFI"}'
  negative:
    - 'AWS_SECRET_ACCESS_KEY = "wJalrXUtnFEMI/{{}}K7MDENG/bPxRfiCYEXAMPLEKEY"'
    - "aws{{}}_secret_access_key = process.env.AWS_SECRET_ACCESS_KEY"
    - 'const aws{{}}Secret = "short"'
