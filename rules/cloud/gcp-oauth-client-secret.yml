id: gcp-oauth-client-secret
name: "Google OAuth client secret"
description: "Google OAuth 2.0 client secret. Lets an attacker impersonate the OAuth application."
severity: high
confidence: high
keywords: ["gocspx-"]
regex: "(?<![A-Za-z0-9_-])(GOCSPX-[A-Za-z0-9_-]{28})(?![A-Za-z0-9_-])"
secretGroup: 1
entropy: 3.5
references:
  - https://developers.google.com/identity/protocols/oauth2
tests:
  positive:
    - 'client_secret: "GOCSPX-{{}}WceMuIzqLrueY9_w_lJeHn61-gRI"'
  negative:
    - "GOCSPX-{{}}xxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    - "GOCSPX-{{}}short"
